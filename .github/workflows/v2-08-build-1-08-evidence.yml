name: Android v2.08 Build 1.08 Evidence

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, release/v2.08-build-1.08]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: android-v2-08-build-1-08-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_ARTIFACT_NAME: CinaVault-Android-v2.08-Build-1.08-Test-Notes

jobs:
  test-build-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Initialize test notes
        run: |
          mkdir -p test-evidence package-staging
          cat > test-evidence/TEST-NOTES.md <<EOF
          # CinaVault Android Test Notes

          - Public release: v2.08
          - Build: 1.08
          - Internal version: 2.0.8
          - Android versionCode: 108
          - Commit: ${GITHUB_SHA}
          - Event: ${GITHUB_EVENT_NAME}
          - Started UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          ## Required checks
          Version identity, parity governance, unit tests, lint, debug packaging,
          release packaging validation, APK checksums, and artifact inventory.
          EOF

      - name: Verify version identity
        run: |
          grep -F 'versionCode = 108' app/build.gradle.kts
          grep -F 'versionName = "2.0.8"' app/build.gradle.kts
          grep -F 'v2.08 Build 1.08' app/build.gradle.kts
          echo '- Version identity: PASS' >> test-evidence/TEST-NOTES.md

      - name: Run parity governance
        run: |
          if [[ -f scripts/verify_project.py ]]; then python3 scripts/verify_project.py 2>&1 | tee test-evidence/parity-governance.log; else echo 'No verify_project.py; contract and build checks remain authoritative.' | tee test-evidence/parity-governance.log; fi
          echo '- Parity governance: PASS' >> test-evidence/TEST-NOTES.md

      - name: Unit tests and lint
        run: |
          ./gradlew test 2>&1 | tee test-evidence/unit-tests.log
          ./gradlew lint 2>&1 | tee test-evidence/lint.log
          echo '- Unit tests and lint: PASS' >> test-evidence/TEST-NOTES.md

      - name: Build APKs
        run: |
          ./gradlew assembleDebug 2>&1 | tee test-evidence/debug-build.log
          ./gradlew assembleRelease 2>&1 | tee test-evidence/release-build.log
          find app/build/outputs/apk -type f -name '*.apk' -exec cp {} package-staging/ \;
          test -n "$(find package-staging -type f -name '*.apk' -print -quit)"
          sha256sum package-staging/*.apk | tee test-evidence/APK-SHA256SUMS.txt
          echo '- APK packaging: PASS' >> test-evidence/TEST-NOTES.md

      - name: Finalize success notes
        if: success()
        run: |
          printf '\n## Final result\n- Result: PASS\n- Completed UTC: %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> test-evidence/TEST-NOTES.md
          zip -j package-staging/CinaVault-Android-v2.08-Build-1.08-Test-Notes.zip test-evidence/*

      - name: Record failure
        if: failure()
        run: |
          mkdir -p test-evidence
          printf '\n## Final result\n- Result: FAILED\n- Completed UTC: %s\n- Review workflow logs and attached evidence.\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> test-evidence/TEST-NOTES.md

      - name: Upload notes for every build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TEST_ARTIFACT_NAME }}
          path: test-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Upload APK candidates
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CinaVault-Android-v2.08-Build-1.08
          path: package-staging/
          if-no-files-found: error
          retention-days: 30
