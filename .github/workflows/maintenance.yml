name: Android Repository Maintenance

on:
  schedule:
    - cron: "37 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: android-repository-maintenance
  cancel-in-progress: false

jobs:
  health-check:
    name: Weekly Android Health
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install stable Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Carry-forward and security governance
        run: python3 scripts/verify_project.py

      - name: Android lint and tests
        run: gradle --no-daemon --stacktrace :app:lintDebug :app:testDebugUnitTest

      - name: Verify installable debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          sha256sum "$apk"

  stale-management:
    name: Stale Work Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Mark inactive work
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 45
          days-before-close: 14
          stale-issue-message: "This Android issue has been inactive for 45 days. Add current reproduction details or implementation status to keep it open."
          stale-pr-message: "This Android pull request has been inactive for 45 days. Rebase it on main and confirm Android CI status to keep it open."
          close-issue-message: "Closed automatically after the stale grace period. Reopen with current Android details if the issue still applies."
          close-pr-message: "Closed automatically after the stale grace period. Reopen or replace it with a fresh branch if work resumes."
          exempt-issue-labels: "pinned,security,release-blocker,automation"
          exempt-pr-labels: "pinned,security,release-blocker"

  artifact-cleanup:
    name: Expire Old Android Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Remove old artifacts
        uses: c-hive/gha-remove-artifacts@v1
        with:
          age: "30 days"
          skip-recent: 5

  failure-report:
    name: Report Android Maintenance Failure
    needs:
      - health-check
      - stale-management
      - artifact-cleanup
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Open or update maintenance issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Android automated maintenance failure: ${context.runNumber}`;
            const body = [
              "The scheduled CinaVault Android maintenance workflow failed.",
              "",
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "No source files were changed automatically. Repair the failure through a normal branch and pull request."
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "automation,maintenance"
            });
            if (!existing.data.some(issue => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["automation", "maintenance"]
              });
            }
