name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
      - v2-build-2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Governance, Test, Lint, and APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - name: Setup Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Verify carry-forward and security rules
        run: python3 scripts/verify_project.py

      - name: Android lint and unit tests
        run: gradle --no-daemon --stacktrace :app:lintDebug :app:testDebugUnitTest

      - name: Build installable debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/CinaVault-Android-v2-Build-2-debug.apk
          test -s artifacts/CinaVault-Android-v2-Build-2-debug.apk
          sha256sum artifacts/CinaVault-Android-v2-Build-2-debug.apk > artifacts/SHA256SUMS.txt
          cat artifacts/SHA256SUMS.txt

      - name: Upload verified Android build
        uses: actions/upload-artifact@v4
        with:
          name: cinavault-android-v2-build-2-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
