name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
      - v2-build-2
      - v2-build-2-platform-parity
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Governance, Contracts, Test, Lint, and APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare diagnostics
        shell: bash
        run: mkdir -p artifacts/diagnostics

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install stable Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 9.5
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          gradle-version: '9.5.0'

      - name: Verify carry-forward and security rules
        id: governance
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/verify_project.py 2>&1 | tee artifacts/diagnostics/governance.log

      - name: Verify canonical contract hashes
        id: contract_hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee artifacts/diagnostics/shared-contract-hashes.json
          import hashlib
          import json
          from pathlib import Path

          root = Path.cwd()
          manifest = json.loads((root / "contracts/v1/contract-manifest.json").read_text())
          results = {}
          for name, record in manifest["fixtures"].items():
              payload = (root / "contracts/v1/golden" / name).read_bytes()
              actual = hashlib.sha256(payload).hexdigest()
              expected = record["sha256"]
              if actual != expected:
                  raise SystemExit(f"Contract hash mismatch for {name}: {actual} != {expected}")
              results[name] = {"sha256": actual, "verified": True}
          print(json.dumps({
              "contractVersion": manifest["contractVersion"],
              "platform": "kotlin",
              "fixtures": results,
          }, indent=2))
          PY

      - name: Kotlin shared contract conformance tests
        id: contract_tests
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:testDebugUnitTest \
            --tests com.cinavault.android.SharedContractConformanceTest \
            2>&1 | tee artifacts/diagnostics/contract-tests.log

      - name: Android lint and complete unit tests
        id: android_tests
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:lintDebug :app:testDebugUnitTest \
            2>&1 | tee artifacts/diagnostics/lint-test.log

      - name: Build installable debug APK
        id: apk
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug \
            2>&1 | tee artifacts/diagnostics/assemble-debug.log

      - name: Verify APK and checksums
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/CinaVault-Android-v2.13-Build-1.13-TEST.apk
          test -s artifacts/CinaVault-Android-v2.13-Build-1.13-TEST.apk
          sha256sum artifacts/CinaVault-Android-v2.13-Build-1.13-TEST.apk > artifacts/SHA256SUMS.txt
          cat artifacts/SHA256SUMS.txt

      - name: Write Android evidence summary
        if: always()
        shell: bash
        env:
          GOVERNANCE: ${{ steps.governance.outcome }}
          CONTRACT_HASHES: ${{ steps.contract_hashes.outcome }}
          CONTRACT_TESTS: ${{ steps.contract_tests.outcome }}
          ANDROID_TESTS: ${{ steps.android_tests.outcome }}
          APK: ${{ steps.apk.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "schemaVersion": 1,
              "platform": "android",
              "commit": os.environ.get("GITHUB_SHA", "local"),
              "contractVersion": 1,
              "steps": {
                  "governance": os.environ["GOVERNANCE"],
                  "contractHashes": os.environ["CONTRACT_HASHES"],
                  "contractTests": os.environ["CONTRACT_TESTS"],
                  "androidTests": os.environ["ANDROID_TESTS"],
                  "apk": os.environ["APK"],
              },
          }
          Path("artifacts/diagnostics/android-evidence.json").write_text(
              json.dumps(evidence, indent=2) + "\n"
          )
          PY

      - name: Upload verified Android build
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cinavault-android-v2-13-build-1-13-test-${{ github.sha }}
          path: |
            artifacts/CinaVault-Android-v2.13-Build-1.13-TEST.apk
            artifacts/SHA256SUMS.txt
            contracts/v1/contract-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android diagnostics and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cinavault-android-v2-build-2-diagnostics-${{ github.sha }}
          path: artifacts/diagnostics/*
          if-no-files-found: warn
          retention-days: 30
