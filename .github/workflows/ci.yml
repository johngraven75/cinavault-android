name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
      - v2-build-2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Governance, Test, Lint, and APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare diagnostics
        shell: bash
        run: mkdir -p artifacts/diagnostics

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install stable Android 16 API 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Verify carry-forward and security rules
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/verify_project.py 2>&1 | tee artifacts/diagnostics/governance.log

      - name: Android lint and unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:lintDebug :app:testDebugUnitTest 2>&1 | tee artifacts/diagnostics/lint-test.log

      - name: Build installable debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee artifacts/diagnostics/assemble-debug.log

      - name: Verify APK and checksums
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/CinaVault-Android-v2-Build-2-debug.apk
          test -s artifacts/CinaVault-Android-v2-Build-2-debug.apk
          sha256sum artifacts/CinaVault-Android-v2-Build-2-debug.apk > artifacts/SHA256SUMS.txt
          cat artifacts/SHA256SUMS.txt

      - name: Upload verified Android build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cinavault-android-v2-build-2-${{ github.sha }}
          path: |
            artifacts/CinaVault-Android-v2-Build-2-debug.apk
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinavault-android-v2-build-2-diagnostics-${{ github.sha }}
          path: artifacts/diagnostics/*
          if-no-files-found: warn
          retention-days: 14
