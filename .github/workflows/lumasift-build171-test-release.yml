name: LumaSift Build 171 Android TEST Release

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "contracts/**"
      - "docs/platform-parity.json"
      - "scripts/verify_project.py"
      - "RELEASE_NOTES_BUILD171.md"
      - ".github/workflows/lumasift-build171-test-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lumasift-build-171-android-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_VERSION: "2.0.14"
  BUILD_CODE: "171"
  RELEASE_TAG: "v2.0.14-android-test"
  ARTIFACT_NAME: "LumaSift-Build171-Android-TEST"

jobs:
  validate-package-publish:
    name: Validate, package, and publish Android TEST APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout current release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android API 36 toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 9.5
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          gradle-version: "9.5.0"

      - name: Verify Build 171 release identity
        shell: bash
        run: |
          set -euo pipefail
          grep -F "versionCode = ${BUILD_CODE}" app/build.gradle.kts
          grep -F "versionName = \"${APP_VERSION}\"" app/build.gradle.kts
          grep -F 'LumaSift Build 171' app/build.gradle.kts
          test -f RELEASE_NOTES_BUILD171.md

      - name: Run governance, unit tests, lint, and package validation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_project.py
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Stage installable Android TEST APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          source_apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$source_apk"
          cp "$source_apk" release-assets/LumaSift-Android-v2.0.14-Build171-TEST.apk
          sha256sum release-assets/LumaSift-Android-v2.0.14-Build171-TEST.apk > release-assets/SHA256SUMS.txt
          cat > release-assets/INSTALL-TEST.md <<'EOF'
          # LumaSift Android 2.0.14 Build 171 TEST

          This debug-signed TEST APK is intended for evaluation. It uses the separate
          `com.cinavault.android.debug` application id and is not a production-signed
          or app-store-distributable release.

          1. Download `LumaSift-Android-v2.0.14-Build171-TEST.apk`.
          2. Allow installation from the browser or file manager when Android prompts.
          3. Install and open the app.
          4. Connect only to a trusted CinaVault HTTPS coordinator.
          EOF

      - name: Upload validated TEST artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-${{ github.sha }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish Build 171 Android TEST prerelease
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: "LumaSift Android 2.0.14 Build 171 — TEST"
          body_path: RELEASE_NOTES_BUILD171.md
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            release-assets/LumaSift-Android-v2.0.14-Build171-TEST.apk
            release-assets/SHA256SUMS.txt
            release-assets/INSTALL-TEST.md
