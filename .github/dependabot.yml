version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:20"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - android
    commit-message:
      prefix: "deps(android)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:40"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - automation
    commit-message:
      prefix: "deps(actions)"
